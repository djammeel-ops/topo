<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e293b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="حاسبة المساحات" />
  <link rel="manifest" href="manifest.json" />
  <title>حاسبة المساحات الطبوغرافية</title>
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: rgba(37, 99, 235, 0.1);
      --success: #16a34a;
      --success-light: rgba(22, 163, 74, 0.12);
      --danger: #dc2626;
      --danger-light: rgba(220, 38, 38, 0.1);
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --input-border: #475569;
    }

    .light-theme {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #15803d;
      --success-light: #f0fdf4;
      --danger: #b91c1c;
      --danger-light: #fef2f2;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --input-bg: #f1f5f9;
      --input-border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, color 0.2s;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 8px 14px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      flex-shrink: 0;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title h1 {
      font-size: 1rem;
      font-weight: 700;
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Fixed Layout: Top Half Fixed Canvas, Bottom Half Scrollable Inputs */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 48px);
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    /* Top Half Fixed */
    .top-fixed-section {
      height: 46vh;
      min-height: 220px;
      max-height: 380px;
      flex-shrink: 0;
      padding: 8px 12px 4px 12px;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-bottom: 2px solid var(--card-border);
      z-index: 20;
    }

    .canvas-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px;
      overflow: hidden;
      position: relative;
    }

    .canvas-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 0.78rem;
    }

    .canvas-title {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .canvas-container {
      flex: 1;
      width: 100%;
      position: relative;
      background: var(--input-bg);
      border-radius: 8px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Bottom Half Scrollable */
    .bottom-scroll-section {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 12px 30px 12px;
    }

    .tabs {
      display: flex;
      background: var(--card-bg);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      margin-bottom: 12px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 8px 6px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(37,99,235,0.3);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .point-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      animation: fadeIn 0.15s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .point-label {
      width: 32px;
      height: 32px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .input-field {
      flex: 1;
    }

    .input-field label {
      display: block;
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .input-field input, .select-field {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field input:focus, .select-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }

    .btn-delete {
      background: var(--danger-light);
      border: none;
      color: var(--danger);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      margin-top: 14px;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s, transform 0.05s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-main {
      background: var(--primary);
      color: white;
    }

    .btn-danger-outline {
      background: var(--danger-light);
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    .btn-calc {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #1d4ed8);
      color: white;
      border: none;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(37,99,235,0.3);
    }

    /* Results */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .result-card {
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .result-card.area {
      background: var(--success-light);
      border: 1px solid var(--success);
    }

    .result-card.peri {
      background: var(--primary-light);
      border: 1px solid var(--primary);
    }

    .result-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .result-value {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 2px;
      direction: ltr;
      display: inline-block;
    }

    .result-unit {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <span style="font-size: 1.2rem;">📐</span>
      <h1>حاسبة المساحات الطبوغرافية</h1>
    </div>
    <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()" title="تغيير المظهر">🌓</button>
  </header>

  <div class="app-main">

    <!-- TOP HALF: Fixed Canvas Area -->
    <div class="top-fixed-section">
      <div class="canvas-panel">
        <div class="canvas-bar">
          <div class="canvas-title">
            <span id="canvasIcon">📏</span>
            <span id="canvasTitleText">مخطط الإحداثيات القائمة (X, Y)</span>
          </div>
          <button class="theme-toggle-btn" onclick="resetActiveScale()" title="إعادة ضبط المقياس">
            🔄 ضبط المقياس
          </button>
        </div>
        <div class="canvas-container">
          <!-- Two canvases for the two modes -->
          <canvas id="cartCanvas"></canvas>
          <canvas id="polCanvas" style="display: none;"></canvas>
        </div>
      </div>
    </div>

    <!-- BOTTOM HALF: Scrollable Content -->
    <div class="bottom-scroll-section">

      <!-- Tabs -->
      <div class="tabs">
        <button id="tabCart" class="tab-btn active" onclick="setMode('cartesian')">
          <span>📏</span>
          <span>إحداثيات قائمة (X, Y)</span>
        </button>
        <button id="tabPol" class="tab-btn" onclick="setMode('polar')">
          <span>🌀</span>
          <span>إحداثيات قطبية (r, θ)</span>
        </button>
      </div>

      <!-- CARTESIAN MODE -->
      <div id="sectionCartesian">
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <span>📍</span>
              <span>نقاط المضلع</span>
            </div>
            <span style="font-size: 0.75rem; color: var(--text-muted);" id="cartCountLabel">0 نقاط</span>
          </div>

          <!-- Points appended at the end -->
          <div id="cartPointsList"></div>

          <div class="actions-grid">
            <button class="btn btn-main" onclick="addCartPoint()">
              <span>➕</span> إضافة نقطة
            </button>
            <button class="btn btn-danger-outline" onclick="clearCart()">
              <span>🗑️</span> مسح الكل
            </button>
          </div>
        </div>

        <button class="btn btn-calc" onclick="calculateCartesian()">
          <span>⚡</span> حساب المساحة
        </button>

        <!-- Cartesian Results: Area only in meters -->
        <div id="cartResultBox" style="display: none;">
          <div class="card">
            <div class="card-title" style="margin-bottom: 10px;">
              <span>📊</span> المساحة الإجمالية
            </div>
            <div class="result-card area" style="text-align:center; padding: 16px; border-radius: 10px;">
              <div class="result-label">المساحة</div>
              <div class="result-value" id="resCartArea" style="color: var(--success); font-size: 2rem;">-</div>
              <div class="result-unit">متر مربع (m²)</div>
            </div>
          </div>
        </div>
      </div>

      <!-- POLAR MODE -->
      <div id="sectionPolar" style="display: none;">
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <span>📍</span>
              <span>النقاط القطبية (شمال لومبار Lambert N)</span>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <label style="font-size: 0.72rem; color: var(--text-muted);">الزاوية:</label>
              <select id="polarUnit" class="select-field" style="padding: 3px 6px; font-size: 0.75rem; width: auto;" onchange="updatePolarLabels()">
                <option value="grad">غراد (gon)</option>
                <option value="deg">درجات (°)</option>
                <option value="rad">راديان (rad)</option>
              </select>
            </div>
          </div>

          <!-- Points appended at the end -->
          <div id="polarPointsList"></div>

          <div class="actions-grid">
            <button class="btn btn-main" onclick="addPolarPoint()">
              <span>➕</span> إضافة نقطة
            </button>
            <button class="btn btn-danger-outline" onclick="clearPolar()">
              <span>🗑️</span> مسح الكل
            </button>
          </div>
        </div>

        <button class="btn btn-calc" onclick="calculatePolar()">
          <span>⚡</span> حساب المساحة
        </button>

        <!-- Polar Results: Area only in meters -->
        <div id="polResultBox" style="display: none;">
          <div class="card">
            <div class="card-title" style="margin-bottom: 10px;">
              <span>📊</span> المساحة الإجمالية
            </div>
            <div class="result-card area" style="text-align:center; padding: 16px; border-radius: 10px;">
              <div class="result-label">المساحة</div>
              <div class="result-value" id="resPolArea" style="color: var(--success); font-size: 2rem;">-</div>
              <div class="result-unit">متر مربع (m²)</div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    // State
    let mode = 'cartesian';
    let cartesianPoints = [];
    let polarPoints = [];

    // Stable coordinate bounds
    let cartBounds = null;
    let polMaxR = 50;

    // Format numbers like plain input: no thousand separators, standard digits
    function formatStandardDigits(num, decimals = 2) {
      if (isNaN(num)) return "0.00";
      return Number(num).toFixed(decimals);
    }

    // Theme Toggle
    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      document.getElementById('themeBtn').textContent = isLight ? '🌙' : '☀️';
      drawCartesian();
      drawPolar();
    }

    // Tab Switching
    function setMode(m) {
      mode = m;
      document.getElementById('sectionCartesian').style.display = m === 'cartesian' ? 'block' : 'none';
      document.getElementById('sectionPolar').style.display = m === 'polar' ? 'block' : 'none';
      document.getElementById('tabCart').classList.toggle('active', m === 'cartesian');
      document.getElementById('tabPol').classList.toggle('active', m === 'polar');

      const cartCanv = document.getElementById('cartCanvas');
      const polCanv = document.getElementById('polCanvas');

      if (m === 'cartesian') {
        cartCanv.style.display = 'block';
        polCanv.style.display = 'none';
        document.getElementById('canvasIcon').textContent = '📏';
        document.getElementById('canvasTitleText').textContent = 'مخطط الإحداثيات القائمة (X, Y)';
        drawCartesian();
      } else {
        cartCanv.style.display = 'none';
        polCanv.style.display = 'block';
        document.getElementById('canvasIcon').textContent = '🧭';
        document.getElementById('canvasTitleText').textContent = 'مخطط الزوايا (شمال لومبار N - مع عقارب الساعة)';
        drawPolar();
      }
    }

    function resetActiveScale() {
      if (mode === 'cartesian') {
        cartBounds = null;
        drawCartesian();
      } else {
        polMaxR = 50;
        drawPolar();
      }
    }

    // ================= CARTESIAN =================
    function renderCartesianPoints() {
      const container = document.getElementById('cartPointsList');
      container.innerHTML = '';
      document.getElementById('cartCountLabel').textContent = `${cartesianPoints.length} نقاط`;

      if (cartesianPoints.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 14px 0; font-size: 0.82rem;">لا توجد نقاط. اضغط "إضافة نقطة" لإدراج النقاط تباعاً.</div>';
        drawCartesian();
        return;
      }

      // Display in order P1, P2, P3... Appending adds to the bottom!
      cartesianPoints.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'point-row';
        row.innerHTML = `
          <div class="point-label">P${idx + 1}</div>
          <div class="input-field">
            <label>X (متر)</label>
            <input type="number" step="any" inputmode="decimal" value="${p.x === '' ? '' : p.x}" oninput="updateCartCoord(${idx}, 'x', this.value)" placeholder="0.00" />
          </div>
          <div class="input-field">
            <label>Y (متر)</label>
            <input type="number" step="any" inputmode="decimal" value="${p.y === '' ? '' : p.y}" oninput="updateCartCoord(${idx}, 'y', this.value)" placeholder="0.00" />
          </div>
          <button class="btn-delete" onclick="removeCartPoint(${idx})" title="حذف النقطة">✕</button>
        `;
        container.appendChild(row);
      });

      drawCartesian();
    }

    function updateCartCoord(idx, axis, val) {
      if (val === '' || isNaN(parseFloat(val))) {
        cartesianPoints[idx][axis] = '';
      } else {
        cartesianPoints[idx][axis] = parseFloat(val);
      }
      drawCartesian();
    }

    // Always appends at the end
    function addCartPoint() {
      cartesianPoints.push({ x: '', y: '' });
      renderCartesianPoints();
      // Scroll bottom section slightly to show newly added point
      const scrollSec = document.querySelector('.bottom-scroll-section');
      setTimeout(() => {
        scrollSec.scrollTop = scrollSec.scrollHeight;
      }, 50);
    }

    function removeCartPoint(idx) {
      cartesianPoints.splice(idx, 1);
      renderCartesianPoints();
    }

    function clearCart() {
      cartesianPoints = [];
      cartBounds = null;
      renderCartesianPoints();
      document.getElementById('cartResultBox').style.display = 'none';
      drawCartesian();
    }

    function computeShoelace(pts) {
      const n = pts.length;
      let sum = 0;
      for (let i = 0; i < n; i++) {
        let next = (i + 1) % n;
        sum += (pts[i].x * pts[next].y) - (pts[next].x * pts[i].y);
      }
      return Math.abs(sum) / 2;
    }

    function computePerimeter(pts) {
      const n = pts.length;
      let peri = 0;
      for (let i = 0; i < n; i++) {
        let next = (i + 1) % n;
        let dx = pts[next].x - pts[i].x;
        let dy = pts[next].y - pts[i].y;
        peri += Math.sqrt(dx * dx + dy * dy);
      }
      return peri;
    }

    function calculateCartesian() {
      const validPoints = cartesianPoints
        .filter(p => p.x !== '' && p.y !== '' && !isNaN(p.x) && !isNaN(p.y))
        .map(p => ({ x: Number(p.x), y: Number(p.y) }));

      if (validPoints.length < 3) {
        alert('يرجى إدخال 3 نقاط على الأقل بإحداثيات صحيحة لحساب المساحة.');
        return;
      }

      const area = computeShoelace(validPoints);

      // Plain number format like input fields: no thousand separators
      document.getElementById('resCartArea').textContent = formatStandardDigits(area, 2);

      document.getElementById('cartResultBox').style.display = 'block';
      drawCartesian();
    }

    function drawCartesian() {
      const canvas = document.getElementById('cartCanvas');
      if (!canvas || canvas.style.display === 'none') return;
      const container = canvas.parentElement;
      const W = container.clientWidth || 320;
      const H = container.clientHeight || 200;
      canvas.width = W * window.devicePixelRatio;
      canvas.height = H * window.devicePixelRatio;
      const ctx = canvas.getContext('2d');
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      ctx.clearRect(0, 0, W, H);

      const isLight = document.body.classList.contains('light-theme');
      const fgColor = isLight ? '#0f172a' : '#f8fafc';
      const gridColor = isLight ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.08)';
      const polyFill = isLight ? 'rgba(37,99,235,0.18)' : 'rgba(37,99,235,0.25)';
      const strokeColor = '#2563eb';

      const pad = 30;

      const valid = cartesianPoints
        .map((p, idx) => ({ x: Number(p.x), y: Number(p.y), idx, valid: (p.x !== '' && p.y !== '' && !isNaN(p.x) && !isNaN(p.y)) }))
        .filter(p => p.valid);

      let minX = 0, maxX = 100, minY = 0, maxY = 100;
      if (valid.length > 0) {
        const xs = valid.map(p => p.x);
        const ys = valid.map(p => p.y);
        const curMinX = Math.min(...xs), curMaxX = Math.max(...xs);
        const curMinY = Math.min(...ys), curMaxY = Math.max(...ys);

        if (!cartBounds) {
          const spanX = Math.max((curMaxX - curMinX), 20);
          const spanY = Math.max((curMaxY - curMinY), 20);
          cartBounds = {
            minX: curMinX - spanX * 0.25,
            maxX: curMaxX + spanX * 0.25,
            minY: curMinY - spanY * 0.25,
            maxY: curMaxY + spanY * 0.25
          };
        } else {
          if (curMinX < cartBounds.minX) cartBounds.minX = curMinX - 10;
          if (curMaxX > cartBounds.maxX) cartBounds.maxX = curMaxX + 10;
          if (curMinY < cartBounds.minY) cartBounds.minY = curMinY - 10;
          if (curMaxY > cartBounds.maxY) cartBounds.maxY = curMaxY + 10;
        }

        minX = cartBounds.minX;
        maxX = cartBounds.maxX;
        minY = cartBounds.minY;
        maxY = cartBounds.maxY;
      }

      const spanX = (maxX - minX) || 1;
      const spanY = (maxY - minY) || 1;

      const scale = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
      const offsetX = pad + (W - 2 * pad - spanX * scale) / 2;
      const offsetY = pad + (H - 2 * pad - spanY * scale) / 2;

      const mapX = x => offsetX + (x - minX) * scale;
      const mapY = y => (H - offsetY) - (y - minY) * scale;

      // Draw Grid
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      for (let g = 0; g <= 4; g++) {
        let x = pad + g * (W - 2 * pad) / 4;
        let y = pad + g * (H - 2 * pad) / 4;
        ctx.beginPath(); ctx.moveTo(x, 8); ctx.lineTo(x, H - 8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(8, y); ctx.lineTo(W - 8, y); ctx.stroke();
      }

      // Draw Polygon
      if (valid.length >= 2) {
        ctx.beginPath();
        valid.forEach((p, i) => {
          const cx = mapX(p.x);
          const cy = mapY(p.y);
          if (i === 0) ctx.moveTo(cx, cy);
          else ctx.lineTo(cx, cy);
        });

        if (valid.length >= 3) {
          ctx.closePath();
          ctx.fillStyle = polyFill;
          ctx.fill();
        }

        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 2.2;
        ctx.stroke();
      }

      // Draw Points
      valid.forEach(p => {
        const cx = mapX(p.x);
        const cy = mapY(p.y);

        ctx.beginPath();
        ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#22c55e';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.font = 'bold 11px system-ui, sans-serif';
        ctx.fillStyle = fgColor;
        ctx.fillText(`P${p.idx + 1}(${p.x}, ${p.y})`, cx + 6, cy - 6);
      });
    }

    // ================= POLAR (Lambert North: Top Y Axis, Clockwise) =================
    function updatePolarLabels() {
      renderPolarPoints();
    }

    function renderPolarPoints() {
      const container = document.getElementById('polarPointsList');
      container.innerHTML = '';
      const unit = document.getElementById('polarUnit').value;
      const unitSymbol = unit === 'deg' ? 'درجة (°)' : unit === 'grad' ? 'غراد (gon)' : 'راديان';

      if (polarPoints.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 14px 0; font-size: 0.82rem;">لا توجد نقاط. اضغط "إضافة نقطة" لإدراج الأرصاد تباعاً.</div>';
        drawPolar();
        return;
      }

      // Appended points appear at the end
      polarPoints.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'point-row';
        row.innerHTML = `
          <div class="point-label">P${idx + 1}</div>
          <div class="input-field">
            <label>المسافة r (متر)</label>
            <input type="number" step="any" inputmode="decimal" value="${p.r === '' ? '' : p.r}" oninput="updatePolarCoord(${idx}, 'r', this.value)" placeholder="0.00" />
          </div>
          <div class="input-field">
            <label>السمت θ (${unitSymbol})</label>
            <input type="number" step="any" inputmode="decimal" value="${p.theta === '' ? '' : p.theta}" oninput="updatePolarCoord(${idx}, 'theta', this.value)" placeholder="0.00" />
          </div>
          <button class="btn-delete" onclick="removePolarPoint(${idx})" title="حذف النقطة">✕</button>
        `;
        container.appendChild(row);
      });

      drawPolar();
    }

    function updatePolarCoord(idx, field, val) {
      if (val === '' || isNaN(parseFloat(val))) {
        polarPoints[idx][field] = '';
      } else {
        polarPoints[idx][field] = parseFloat(val);
      }
      drawPolar();
    }

    // Always appends at the end
    function addPolarPoint() {
      polarPoints.push({ r: '', theta: '' });
      renderPolarPoints();
      const scrollSec = document.querySelector('.bottom-scroll-section');
      setTimeout(() => {
        scrollSec.scrollTop = scrollSec.scrollHeight;
      }, 50);
    }

    function removePolarPoint(idx) {
      polarPoints.splice(idx, 1);
      renderPolarPoints();
    }

    function clearPolar() {
      polarPoints = [];
      polMaxR = 50;
      renderPolarPoints();
      document.getElementById('polResultBox').style.display = 'none';
      drawPolar();
    }

    /**
     * Topographic Lambert North (North = Up on Y-axis, Angle θ goes Clockwise):
     * θ = 0 (North): X = 0, Y = +r
     * θ = 90 deg / 100 gon (East): X = +r, Y = 0
     * θ = 180 deg / 200 gon (South): X = 0, Y = -r
     * θ = 270 deg / 300 gon (West): X = -r, Y = 0
     * 
     * Formula:
     * X = r * sin(θ)
     * Y = r * cos(θ)
     */
    function toLambertCartesian(r, theta, unit) {
      let rad = theta;
      if (unit === 'deg') rad = (theta * Math.PI) / 180;
      else if (unit === 'grad') rad = (theta * Math.PI) / 200;
      return {
        x: r * Math.sin(rad),
        y: r * Math.cos(rad)
      };
    }

    function calculatePolar() {
      const unit = document.getElementById('polarUnit').value;
      const validPolar = polarPoints
        .filter(p => p.r !== '' && p.theta !== '' && !isNaN(p.r) && !isNaN(p.theta))
        .map(p => ({ r: Number(p.r), theta: Number(p.theta) }));

      if (validPolar.length < 3) {
        alert('يرجى إدخال 3 نقاط على الأقل بإحداثيات صحيحة لحساب المساحة.');
        return;
      }

      const convertedPts = validPolar.map(p => toLambertCartesian(p.r, p.theta, unit));

      const area = computeShoelace(convertedPts);

      // Plain number format like input fields: no thousand separators
      document.getElementById('resPolArea').textContent = formatStandardDigits(area, 2);

      document.getElementById('polResultBox').style.display = 'block';
      drawPolar();
    }

    function drawPolar() {
      const canvas = document.getElementById('polCanvas');
      if (!canvas || canvas.style.display === 'none') return;
      const container = canvas.parentElement;
      const W = container.clientWidth || 320;
      const H = container.clientHeight || 200;
      canvas.width = W * window.devicePixelRatio;
      canvas.height = H * window.devicePixelRatio;
      const ctx = canvas.getContext('2d');
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

      ctx.clearRect(0, 0, W, H);

      const isLight = document.body.classList.contains('light-theme');
      const fgColor = isLight ? '#0f172a' : '#f8fafc';
      const gridColor = isLight ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.09)';
      const polyFill = isLight ? 'rgba(16,185,129,0.18)' : 'rgba(16,185,129,0.25)';
      const strokeColor = '#10b981';

      const pad = 24;
      const unit = document.getElementById('polarUnit') ? document.getElementById('polarUnit').value : 'grad';

      const valid = polarPoints
        .map((p, idx) => ({ r: Number(p.r), theta: Number(p.theta), idx, valid: (p.r !== '' && p.theta !== '' && !isNaN(p.r) && !isNaN(p.theta)) }))
        .filter(p => p.valid)
        .map(p => {
          const c = toLambertCartesian(p.r, p.theta, unit);
          return { ...p, x: c.x, y: c.y };
        });

      // Stable scale
      const curMaxR = valid.length > 0 ? Math.max(...valid.map(p => p.r)) : 40;
      if (curMaxR > polMaxR) {
        polMaxR = curMaxR * 1.25;
      }

      const oX = W / 2;
      const oY = H / 2;
      const maxVisualRadius = Math.min(W, H) / 2 - pad;
      const scale = maxVisualRadius / Math.max(polMaxR, 10);

      // Concentric circles
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      [0.33, 0.66, 1.0].forEach(factor => {
        ctx.beginPath();
        ctx.arc(oX, oY, maxVisualRadius * factor, 0, Math.PI * 2);
        ctx.stroke();
      });

      // Axes: North-South & East-West
      ctx.strokeStyle = isLight ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.moveTo(oX, 6); ctx.lineTo(oX, H - 6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6, oY); ctx.lineTo(W - 6, oY); ctx.stroke();

      // Topographic Lambert North Indicator (North arrow on top of Y-axis)
      ctx.save();
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(oX, 8);
      ctx.lineTo(oX - 5, 20);
      ctx.lineTo(oX + 5, 20);
      ctx.closePath();
      ctx.fill();

      ctx.font = 'bold 11px system-ui';
      ctx.fillText('N (شمال)', oX + 8, 16);
      ctx.restore();

      // Map coords to screen:
      // X = screenX (oX + x*scale)
      // Y = screenY (oY - y*scale) (Since North/Y is UP)
      const mapX = x => oX + x * scale;
      const mapY = y => oY - y * scale;

      // Rays from station (with clockwise direction feel)
      valid.forEach(p => {
        const cx = mapX(p.x);
        const cy = mapY(p.y);
        ctx.beginPath();
        ctx.setLineDash([3, 3]);
        ctx.moveTo(oX, oY);
        ctx.lineTo(cx, cy);
        ctx.strokeStyle = 'rgba(148,163,184,0.5)';
        ctx.stroke();
        ctx.setLineDash([]);
      });

      // Polygon
      if (valid.length >= 2) {
        ctx.beginPath();
        valid.forEach((p, i) => {
          const cx = mapX(p.x);
          const cy = mapY(p.y);
          if (i === 0) ctx.moveTo(cx, cy);
          else ctx.lineTo(cx, cy);
        });

        if (valid.length >= 3) {
          ctx.closePath();
          ctx.fillStyle = polyFill;
          ctx.fill();
        }

        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 2.2;
        ctx.stroke();
      }

      // Station Point O(0,0)
      ctx.beginPath();
      ctx.arc(oX, oY, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444';
      ctx.fill();
      ctx.font = 'bold 10px system-ui';
      ctx.fillStyle = fgColor;
      ctx.fillText('O (0,0)', oX + 6, oY + 12);

      // Points
      valid.forEach(p => {
        const cx = mapX(p.x);
        const cy = mapY(p.y);
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#2563eb';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.font = 'bold 10px system-ui';
        ctx.fillStyle = fgColor;
        ctx.fillText(`P${p.idx + 1}`, cx + 5, cy - 5);
      });
    }

    // Window Resize
    window.addEventListener('resize', () => {
      drawCartesian();
      drawPolar();
    });

    // Initial render
    renderCartesianPoints();
    renderPolarPoints();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
